name: Validate Source

# Phase 1. The API key is a repository secret, so the only place the
# Smithsonian API can be reached is from inside a job. This prints what
# the API returns -- structure and counts, never the key.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe the Smithsonian Open Access API
        env:
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
        run: python3 probe.py
